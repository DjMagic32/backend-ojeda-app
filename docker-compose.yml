services:
  web:
    build: .
    ports:
      - '8000:8000'
    env_file:
      - .env
    depends_on:
      - db
    environment:
      - PYTHONUNBUFFERED=1
      - AUTO_MIGRATE=1
      - PORT=8000
      - DJANGO_DB_ENGINE=postgresql
      - POSTGRES_DB=mydatabase
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    volumes:
      - ./static:/code/static
      - ./media:/code/media
      - .:/code

  db:
    image: postgres:13-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword

volumes:
  postgres_data:
